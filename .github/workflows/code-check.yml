name: code-check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer commit cancels runs for older commits on the same branch/PR
  # (never the weekly scheduled runs)
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-check:
    name: Mininet Code Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install code check dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run code check
        run: make codecheck PYTHON=python
      - name: The ATT&CK coverage page matches the control list
        run: |
          python scripts/security/attack-report.py --doc > coverage.md
          diff -u docs/security/attack-coverage.md coverage.md || {
            echo "::error title=Out of date::Run"\
              "'scripts/security/attack-report.py --doc >"\
              "docs/security/attack-coverage.md'"; exit 1; }
      - name: API documentation builds (doxygen + util/doxify.py)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -qq doxygen
          python util/doxify.py mininet/net.py > /dev/null
          ( cat doc/doxygen.cfg; echo "GENERATE_LATEX = NO" ) | doxygen -
          test -s doc/html/index.html
