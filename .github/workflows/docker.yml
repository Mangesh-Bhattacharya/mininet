name: docker

# Builds, tests, scans and publishes the Mininet image to GHCR.
#
# Runs every Monday as well as on every push: the scheduled build starts
# from the newest ubuntu:24.04 base and installs every pending security
# update, so the published image is never more than a week behind on
# patches. Images are scanned with Trivy (the build fails on fixable
# HIGH/CRITICAL vulnerabilities), published with an SBOM and build
# provenance, and signed with Sigstore cosign (see SECURITY.md).

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

env:
  IMAGE: ghcr.io/mangesh-bhattacharya/mininet

jobs:
  test:
    name: Build, test and scan (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          pull: true
          # Scheduled builds skip the cache so apt-get upgrade really runs
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: mininet:test
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Userspace datapath (what Docker Desktop on Windows/macOS uses)
        run: |
          docker run --rm --privileged -e MININET_OVS_DATAPATH=user mininet:test \
            bash -c 'mn-doctor; mn --test pingall && sudo mn --topo tree,2,2 --test pingall'
      - name: Kernel datapath (Linux hosts)
        run: |
          if sudo modprobe openvswitch; then
            docker run --rm --privileged -v /lib/modules:/lib/modules:ro \
              mininet:test mn --test pingall
          else
            echo "::notice::openvswitch module unavailable on this runner; skipped"
          fi
      - name: Lab configurations (YAML, Python, C, C++, Ruby)
        run: |
          docker run --rm --privileged mininet:test bash -ec '
            cd /tmp
            for spec in yaml:lab.yaml python:lab.py c:lab.c cpp:lab.cpp ruby:lab.rb; do
              mn-config init --lang "${spec%%:*}" -o "${spec#*:}"
              mn-config run "${spec#*:}" --no-cli
            done'
      - name: Browser GUI (published to 127.0.0.1 only)
        run: |
          TOKEN="ci-$(od -An -tx1 -N16 /dev/urandom | tr -d ' \n')"
          docker run -d --name mngui --privileged -e MININET_GUI_TOKEN="$TOKEN" \
            -p 127.0.0.1:8765:8080 mininet:test mn-gui
          trap 'docker logs mngui; docker rm -f mngui' EXIT
          scripts/ci/gui-api-check.sh http://localhost:8765 "$TOKEN"
      - name: Launcher script
        run: scripts/mininet-docker.sh --image mininet:test --no-mount mn --switch lxbr --controller none --test pingall
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mininet:test
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
      - name: Upload scan results to GitHub code scanning
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ matrix.arch }}
      - name: Fail on fixable HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mininet:test
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

  test-full:
    name: Build and test the full (all languages) image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          build-args: CONFIG_LANGUAGES=full
          tags: mininet:full
          cache-from: type=gha,scope=full
          cache-to: type=gha,mode=max,scope=full
      - name: Java, C# and COBOL lab configurations
        run: |
          docker run --rm --privileged mininet:full bash -ec '
            mn-config languages
            cd /tmp
            for spec in java:Lab.java csharp:lab.cs cobol:lab.cob; do
              mn-config init --lang "${spec%%:*}" -o "${spec#*:}"
              mn-config run "${spec#*:}" --no-cli
            done'
      - name: Fail on fixable HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mininet:full
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  publish:
    name: Publish ${{ matrix.variant }} image to GHCR
    needs: [test, test-full]
    # The standard image only needs its own tests; the full image also
    # needs test-full (checked in the first step)
    if: always() && needs.test.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            latest: latest
            suffix: ""
          - variant: full
            latest: full
            suffix: "-full"
    steps:
      - name: The full image passed its tests and scan
        if: matrix.variant == 'full' && needs.test-full.result != 'success'
        run: |
          echo "::error::test-full did not pass; the full image is not published"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          # standard: latest, v1.2.3, sha-abc1234, 20260921 (weekly)
          # full:     full, v1.2.3-full, sha-abc1234-full, 20260921-full
          tags: |
            type=raw,value=${{ matrix.latest }},enable={{is_default_branch}}
            type=ref,event=tag,suffix=${{ matrix.suffix }}
            type=sha,format=short,suffix=${{ matrix.suffix }}
            type=schedule,pattern={{date 'YYYYMMDD'}},suffix=${{ matrix.suffix }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          push: true
          build-args: CONFIG_LANGUAGES=${{ matrix.variant }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
            type=gha,scope=full
      - name: Sign the image (Sigstore keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
