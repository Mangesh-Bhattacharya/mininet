name: install-matrix

# Runs util/install.sh inside clean containers of each supported
# distribution, then brings up real Mininet networks using the runner's
# kernel. This is how Debian (and releases GitHub has no runner for)
# are tested.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer commit cancels runs for older commits on the same branch/PR
  # (never the weekly scheduled runs)
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  distro:
    name: install.sh on ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04",
                "debian:12", "debian:13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load kernel modules on the host
        run: sudo modprobe -a openvswitch sch_htb sch_netem
      - name: Install and test Mininet in ${{ matrix.image }}
        run: |
          docker run --rm --privileged \
            -v /lib/modules:/lib/modules:ro \
            -v "$PWD:/src:ro" \
            "${{ matrix.image }}" bash -c '
              set -ex
              cp -a /src /root/mininet
              cd /root/mininet
              util/install.sh -nv
              ovs-vsctl -t 2 show || /usr/share/openvswitch/scripts/ovs-ctl start
              mn --version
              mn-doctor
              mn --test pingall
              mn --switch lxbr --controller none --test pingall
              MININET_OVS_DATAPATH=user mn --test pingall
              mn --topo linear,3 --link tc,bw=5,delay=2ms --test iperf
            '

  derivative:
    # Zorin OS, Linux Mint, Pop!_OS and friends report their own version
    # (Zorin 17), not the Ubuntu release their packages come from. These
    # containers are the real Ubuntu base with the derivative's
    # /etc/os-release, which is what install.sh has to cope with.
    name: install.sh on ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Zorin OS 17 (Ubuntu 22.04)
            image: "ubuntu:22.04"
            id: zorin
            pretty: "Zorin OS 17"
            version: "17"
            codename: jammy
          - name: Linux Mint 22 (Ubuntu 24.04)
            image: "ubuntu:24.04"
            id: linuxmint
            pretty: "Linux Mint 22"
            version: "22"
            codename: noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load kernel modules on the host
        run: sudo modprobe -a openvswitch sch_htb sch_netem
      - name: Install and test Mininet on ${{ matrix.name }}
        run: |
          docker run --rm --privileged \
            -v /lib/modules:/lib/modules:ro \
            -v "$PWD:/src:ro" \
            -e DERIV_ID='${{ matrix.id }}' \
            -e DERIV_PRETTY='${{ matrix.pretty }}' \
            -e DERIV_VERSION='${{ matrix.version }}' \
            -e DERIV_CODENAME='${{ matrix.codename }}' \
            "${{ matrix.image }}" bash -c '
              set -ex
              cat > /etc/os-release <<EOF
          NAME="$DERIV_PRETTY"
          VERSION="$DERIV_VERSION"
          ID=$DERIV_ID
          ID_LIKE="ubuntu debian"
          PRETTY_NAME="$DERIV_PRETTY"
          VERSION_ID="$DERIV_VERSION"
          VERSION_CODENAME=$DERIV_CODENAME
          UBUNTU_CODENAME=$DERIV_CODENAME
          EOF
              cp -a /src /root/mininet
              cd /root/mininet
              util/install.sh -nv
              ovs-vsctl -t 2 show || /usr/share/openvswitch/scripts/ovs-ctl start
              mn-doctor
              mn --test pingall
              mn-config init -o /tmp/lab.yaml
              mn-config run /tmp/lab.yaml --no-cli
            '

  reference-switch:
    # util/install.sh -f builds the OpenFlow 1.0 reference implementation,
    # whose C code predates current compilers: gcc 14 turned several type
    # mismatches into errors and gcc 15 (Ubuntu 26.04) defaults to C23.
    name: Reference switch on ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "ubuntu:26.04"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load kernel modules on the host
        run: sudo modprobe -a openvswitch sch_htb sch_netem
      - name: Build and run the reference switch in ${{ matrix.image }}
        run: |
          docker run --rm --privileged \
            -v /lib/modules:/lib/modules:ro \
            -v "$PWD:/src:ro" \
            "${{ matrix.image }}" bash -c '
              set -ex
              cp -a /src /root/mininet
              cd /root/mininet
              util/install.sh -nvf
              gcc --version | head -1
              ofdatapath --version
              ofprotocol --version
              controller --help > /dev/null
              ovs-vsctl -t 2 show || /usr/share/openvswitch/scripts/ovs-ctl start
              # --switch user is the reference switch just built
              mn --switch user --test pingall
              mn --switch user --controller ref --test pingall
            '

  nonroot:
    # The point of util/nonroot-setup.sh: after it, somebody who is not
    # an administrator runs Mininet by typing "mn", with no sudo and no
    # password. Proved end to end on a real network.
    name: Mininet without sudo
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load kernel modules on the host
        run: sudo modprobe -a openvswitch sch_htb sch_netem
      - name: Install, set up a plain user, and run as that user
        run: |
          docker run --rm --privileged \
            -v /lib/modules:/lib/modules:ro \
            -v "$PWD:/src:ro" \
            ubuntu:24.04 bash -c '
              set -ex
              apt-get update -qq
              apt-get install -y -qq sudo adduser > /dev/null
              cp -a /src /root/mininet
              cd /root/mininet
              util/install.sh -nv
              /usr/share/openvswitch/scripts/ovs-ctl start || \
                service openvswitch-switch start
              # A plain user: no sudo rights of any kind to begin with
              adduser --disabled-password --gecos "" student
              sudo -u student -H sh -c "cd ~ && ! mn --test pingall" \
                && echo "as expected, mn needs root before the setup"
              util/nonroot-setup.sh --status
              # The administrator sets it up, once
              util/nonroot-setup.sh --user student
              util/nonroot-setup.sh --status
              # ...and now the student just runs it. No sudo typed.
              sudo -u student -H sg mininet -c "mn --test pingall"
              sudo -u student -H sg mininet -c "mn-config init --lang yaml -o /tmp/lab.yaml"
              sudo -u student -H sg mininet -c "mn-config run --no-cli /tmp/lab.yaml"
              sudo -u student -H sg mininet -c "mn-doctor" | grep -i "without a password"
              # Undoing it puts the machine back as it was
              util/nonroot-setup.sh --remove
              sudo -u student -H sg mininet -c "! mn --test pingall" \
                && echo "as expected, removing the rule needs root again"
            '
